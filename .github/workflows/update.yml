name: Verify and publish public holidays
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Redeploy validated data to check deployment credentials
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['public/**', 'status.json']
  pull_request:
permissions:
  contents: read
concurrency:
  group: holidays-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/resolve_source.py
      - run: pip install -r requirements.txt
      - run: python scripts/holiday_data.py generate
      - run: python -m unittest discover -s tests -v
      - name: Record candidate diff
        run: git diff --stat >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-holidays
          retention-days: 1
          path: |
            public/
            status.json
            requirements.txt
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: generate
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: rm -rf public
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-holidays
      - run: python scripts/holiday_data.py validate
      - name: Reject an outdated source revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - name: Deploy changed data and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FORCE_DEPLOY: ${{ inputs.force_deploy || github.event_name == 'push' }}
        run: |
          if [ "$FORCE_DEPLOY" = 'true' ] || ! git diff --quiet -- public || [ -n "$(git ls-files --others --exclude-standard public)" ]; then
            python scripts/deploy.py
          else
            python scripts/deploy.py --verify-only
          fi
  record:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -rf public
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-holidays
      - name: Save data and daily check record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public status.json requirements.txt
          git diff --cached --quiet || git commit -m 'data: verify and refresh public holidays'
          git push origin HEAD:main
