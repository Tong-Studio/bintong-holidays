name: Verify and publish public holidays
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['public/**', 'status.json']
  pull_request:
permissions:
  contents: read
concurrency:
  group: holidays-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/resolve_source.py
      - run: pip install -r requirements.txt
      - run: python scripts/holiday_data.py generate
      - run: python -m unittest discover -s tests -v
      - name: Record candidate diff
        run: git diff --stat >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-holidays
          retention-days: 1
          path: |
            public/
            status.json
            requirements.txt
  publish:
    if: github.event_name != 'pull_request'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: rm -rf public
      - uses: actions/download-artifact@v4
        with:
          name: verified-holidays
      - run: python scripts/holiday_data.py validate
      - name: Deploy changed data and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! git diff --quiet -- public || [ -n "$(git ls-files --others --exclude-standard public)" ]; then
            python scripts/deploy.py
          else
            python scripts/deploy.py --verify-only
          fi
      - name: Save data and daily check record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public status.json requirements.txt
          git diff --cached --quiet || git commit -m 'data: verify and refresh public holidays'
          git push origin HEAD:main
